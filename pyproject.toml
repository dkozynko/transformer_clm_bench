[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-clm-bench"
version = "0.1.0"
description = "Compact causal language modeling benchmark for Differential Transformer and strong baselines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "tqdm",
]

[project.optional-dependencies]
fix-cuda = [
    "flash-linear-attention @ git+https://github.com/AlayaDB-AI/FiX.git@e761e25ff9feb95f8a10882950a950a880884c8c",
]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
